<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">OWASP ZAP passive review of a local application</title>
  <desc id="desc">Normal browser requests pass through ZAP to an application on localhost; passive findings are reviewed and remediated.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#526579"/>
    </marker>
  </defs>
  <rect width="760" height="300" rx="18" fill="#f4f7fb"/>
  <text x="32" y="42" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#172b4d">Local web assessment with passive analysis</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="34" y="82" width="190" height="88" rx="12" fill="#e1efff" stroke="#7ca9d8"/>
    <text x="129" y="116" font-size="16" font-weight="700" fill="#17365d">Browser</text>
    <text x="129" y="143" font-size="13" fill="#345">Normal test browsing</text>
    <rect x="285" y="82" width="190" height="88" rx="12" fill="#e7f5ed" stroke="#79b58d"/>
    <text x="380" y="116" font-size="16" font-weight="700" fill="#174b2b">OWASP ZAP</text>
    <text x="380" y="143" font-size="13" fill="#345">Passive alerts</text>
    <rect x="536" y="82" width="190" height="88" rx="12" fill="#fff1d9" stroke="#d8ae62"/>
    <text x="631" y="116" font-size="16" font-weight="700" fill="#684400">Owned app</text>
    <text x="631" y="143" font-size="13" fill="#345">127.0.0.1 only</text>
    <path d="M230 116H275" stroke="#526579" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M475 116H526" stroke="#526579" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M526 148H230" stroke="#8a6bb8" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="380" y="197" font-size="12" fill="#5b4b73">Responses return through the local proxy</text>
  </g>
  <rect x="34" y="220" width="692" height="43" rx="10" fill="#172b4d"/>
  <text x="380" y="247" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">Review findings, fix issues, and keep the target local and authorized.</text>
</svg>
