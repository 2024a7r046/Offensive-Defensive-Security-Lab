<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">Defensive incident mapping with MITRE ATT&amp;CK</title>
  <desc id="desc">Synthetic observations are mapped to candidate ATT&amp;CK behaviors, evidence confidence is assessed, and defensive coverage is improved.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#526579"/>
    </marker>
  </defs>
  <rect width="760" height="300" rx="18" fill="#f4f7fb"/>
  <text x="32" y="42" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#172b4d">From synthetic events to defensive improvements</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="34" y="91" width="190" height="92" rx="12" fill="#e1efff" stroke="#7ca9d8"/>
    <text x="129" y="124" font-size="15" font-weight="700" fill="#17365d">Fictional timeline</text>
    <text x="129" y="151" font-size="12" fill="#345">Sign-in, endpoint, alert</text>
    <rect x="285" y="91" width="190" height="92" rx="12" fill="#e7f5ed" stroke="#79b58d"/>
    <text x="380" y="124" font-size="15" font-weight="700" fill="#174b2b">ATT&amp;CK mapping</text>
    <text x="380" y="151" font-size="12" fill="#345">Candidate + confidence</text>
    <rect x="536" y="91" width="190" height="92" rx="12" fill="#fff1d9" stroke="#d8ae62"/>
    <text x="631" y="124" font-size="15" font-weight="700" fill="#684400">Defensive actions</text>
    <text x="631" y="151" font-size="12" fill="#345">Close detection gaps</text>
    <path d="M230 137H275" stroke="#526579" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M481 137H526" stroke="#526579" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
  <rect x="34" y="220" width="692" height="43" rx="10" fill="#172b4d"/>
  <text x="380" y="247" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">A mapping is an evidence-based hypothesis, not proof of attribution.</text>
</svg>
