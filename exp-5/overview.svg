<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">Authorized packet review and session protections</title>
  <desc id="desc">An authorized lab capture is reviewed for metadata in Wireshark; TLS protects application content, and secure session controls reduce risk.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#526579"/>
    </marker>
  </defs>
  <rect width="760" height="300" rx="18" fill="#f4f7fb"/>
  <text x="32" y="42" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#172b4d">Traffic privacy and session security</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="34" y="82" width="198" height="92" rx="12" fill="#e1efff" stroke="#7ca9d8"/>
    <text x="133" y="116" font-size="16" font-weight="700" fill="#17365d">Authorized lab capture</text>
    <text x="133" y="143" font-size="13" fill="#345">PCAP / PCAPNG</text>
    <rect x="281" y="82" width="198" height="92" rx="12" fill="#e7f5ed" stroke="#79b58d"/>
    <text x="380" y="116" font-size="16" font-weight="700" fill="#174b2b">Wireshark review</text>
    <text x="380" y="143" font-size="13" fill="#345">Protocol metadata only</text>
    <rect x="528" y="82" width="198" height="92" rx="12" fill="#fff1d9" stroke="#d8ae62"/>
    <text x="627" y="116" font-size="16" font-weight="700" fill="#684400">Protected sessions</text>
    <text x="627" y="143" font-size="13" fill="#345">TLS + secure cookies</text>
    <path d="M238 128H270" stroke="#526579" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M485 128H517" stroke="#526579" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
  <rect x="34" y="207" width="692" height="54" rx="10" fill="#172b4d"/>
  <text x="380" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">Inspect metadata; do not collect credentials or access live sessions.</text>
</svg>
